name: Check Package Version on every monday and pushing on main branch

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main

jobs:
  check:
    name: Check npm packages version
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
    
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: "pnpm"
    
      - name: Check if there is outdated packages and set an environment variable
        id: outdated-check
        run: |
          if [ "$(pnpm outdated --json || echo '{}')" != "{}" ]; then
            echo "Outdated packages found."
            echo "outdated=true" >> $GITHUB_OUTPUT
          else
            echo "No outdated packages."
            echo "outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue body as a markdown file
        if: ${{ steps.outdated-check.outputs.outdated }} == 'true'
        run: |
          echo "| Package | Current Version | Latest Version |" > issue_body.md
          echo "|---------|-----------------|----------------|" >> issue_body.md
          npm outdated --json || echo "{}" | jq -r '. | to_entries | .[] | "| \(.key) | \(.value.current) | \(.value.latest) |"' >> issue_body.md

      - name: Create GitHub issue
        if: ${{ steps.outdated-check.outputs.outdated }} == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "新しいバージョンのパッケージに更新してください"
          content-filepath: ./issue_body.md
