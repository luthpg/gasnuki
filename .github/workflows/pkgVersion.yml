name: Check Package Version on every monday and pushing on main branch

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check npm packages version
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
    
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
    
      - name: Check for outdated packages and save result
        id: outdated-check
        shell: bash
        run: |
          # pnpm outdated exits with a non-zero code if outdated packages are found.
          # We redirect output to a file and use `|| true` to prevent the step from failing.
          pnpm outdated --format json >> outdated.json || true

          # We check if the json file has any top-level keys.
          # If it does, it means there are outdated packages.
          if jq -e 'keys | length > 0' outdated.json > /dev/null; then
            echo "Outdated packages found."
            echo "outdated=true" >> $GITHUB_OUTPUT
          else
            echo "No outdated packages."
            echo "outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub issue body from file
        if: steps.outdated-check.outputs.outdated == 'true'
        run: |
          echo "| Package | Current Version | Latest Version | Location | isDeprecated |" > issue_body.md
          echo "|---------|-----------------|----------------|----------|--------------|" >> issue_body.md
          cat outdated.json | jq -r 'to_entries | .[] | "| \(.key) | \(.value.current) | \(.value.latest) | \(.value.dependencyType) | \(.value.isDeprecated) |"' >> issue_body.md

      - name: Create GitHub issue
        if: steps.outdated-check.outputs.outdated == 'true'
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: "新しいバージョンのパッケージに更新してください"
          content-filepath: ./issue_body.md
